spring:
  application:
    name: chagok
  # 로컬 개발: 레포 루트의 .env 파일(Git 제외)을 읽는다. OS 환경변수가 있으면 그쪽이 우선한다.
  config:
    import: optional:file:.env[.properties]

  # DB 접속 정보는 환경변수로만 받는다. 기본값이 없으므로 빠지면 기동에 실패한다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate      # 테이블은 Flyway만 만든다. Entity는 검증만
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  # schema.sql / data.sql 자동 실행은 쓰지 않는다
  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
