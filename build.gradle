plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.wanted'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 · 검증 · 보안
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // DB: JPA + Flyway + MySQL (Spring Boot 4부터 Flyway는 전용 스타터가 필요)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // JWT 라이브러리는 인증 `기반` 이슈에서 추가한다 (README "아직 넣지 않은 것")

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot 4부터 테스트 지원도 기술별 스타터로 나뉜다
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    // 아키텍처 규칙 자동 검사 (CONVENTIONS 8장). DB 없이 돈다
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 테스트를 둘로 나눈다.
//  - test   : DB 없이 도는 테스트 (아키텍처·단위). `./gradlew build`에 포함
//  - dbTest : MySQL이 필요한 테스트 (@Tag("db")). DB 환경변수가 있어야 한다. CI는 backend-ci의 db-test 작업에서 돌린다
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'db'
    }
}

tasks.register('dbTest', Test) {
    description = 'MySQL이 필요한 테스트(@Tag("db"))만 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'db'
    }
    shouldRunAfter tasks.named('test')
}
