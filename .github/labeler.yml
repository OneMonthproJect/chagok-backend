# actions/labeler v5 설정 — PR에 라벨 자동 부착 (chagok-backend)
backend:
  - changed-files:
      - any-glob-to-any-file: ["src/**", "build.gradle", "settings.gradle", "gradle/**"]
db:
  - changed-files:
      - any-glob-to-any-file: ["src/main/resources/db/**", "db/**"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", ".coderabbit.yaml", ".claude/settings.json", "CLAUDE.md"]
feature:
  - head-branch: ["^feature/"]
fix:
  - head-branch: ["^fix/"]
release:
  - base-branch: ["^main$"]
review-me:
  - changed-files:
      - any-glob-to-any-file:
          - "src/main/java/**/domain/cycle/**"
          - "src/main/java/**/global/**"
          - "src/main/resources/db/migration/**"
